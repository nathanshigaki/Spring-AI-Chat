spring.application.name=budgeting

# Carrega variáveis do arquivo .env local (se existir)
spring.config.import=optional:file:.env[.properties]

# Database Configuration (MySQL 9 via Docker Compose)
spring.datasource.url=jdbc:mysql://localhost:3307/transaction?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring AI Configuration (Groq Cloud API - 100% Gratuito)
# Compatível com o protocolo OpenAI (o Spring AI adiciona automaticamente o /v1)
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:${OPENAI_API_KEY:demo-key}}

# LLM Chat Options (Modelo com suporte a Tool Calling nativo)
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.1

# Speech-to-Text Transcription Options (Whisper Large v3 gratuito via Groq)
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=${AI_AUDIO_MODEL:whisper-large-v3}
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro com descrição de finanças pessoais, valores em reais, gastos, pagamentos ou receitas.

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.org.springframework.ai=INFO
